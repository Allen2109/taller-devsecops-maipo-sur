name: seguridad-planta

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      sector:
        description: 'Sector simulado a verificar'
        required: true
        type: choice
        default: todos
        options:
          - todos
          - agua
          - energia
          - salud
          - transporte

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Obtener código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1 # Escaneo de archivos actuales en este taller
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Instalar Gitleaks para el laboratorio
        shell: bash
        run: |
          go install github.com/gitleaks/gitleaks/v8@v8.28.0
          "$(go env GOPATH)/bin/gitleaks" version
      - name: Buscar credenciales en los archivos del repositorio
        shell: bash
        run: |
          "$(go env GOPATH)/bin/gitleaks" dir --no-banner --redact --config .gitleaks.toml .
      - name: Revisar casos sectoriales
        env:
          SECTOR: ${{ inputs.sector || 'todos' }}
        run: python scripts/revisar_sector.py "$SECTOR"
      - name: Probar servicio local
        env:
          PLC_PASSWORD: ${{ secrets.PLC_PASSWORD || 'FICTICIO_SOLO_LABORATORIO' }}
        run: python scripts/prueba_funcional.py
      - name: Ejecutar tests de validación
        run: python -m unittest discover -s tests -v
