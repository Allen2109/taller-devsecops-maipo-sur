name: integracion-planta

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Obtener el código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Pruebas unitarias y detectores
        run: |
          python -m unittest discover -s tests -v
          python scripts/revisar_sector.py todos
      - name: Prueba funcional con variable ficticia de laboratorio
        env:
          PLC_PASSWORD: ${{ secrets.PLC_PASSWORD || 'FICTICIO_SOLO_LABORATORIO' }}
        run: python scripts/prueba_funcional.py
      - name: Generar SBOM académica
        run: python scripts/generar_sbom.py
      - name: Empaquetar aplicación
        run: python scripts/build.py
      - name: Publicar artefactos
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maipo-sur-build-${{ github.sha }}
          path: |
            dist/maipo-sur-simulador.zip
            evidencias/sbom-local.cdx.json
          retention-days: 14
          if-no-files-found: error
